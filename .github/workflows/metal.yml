name: metal
on:
  push:
    branches:
      - master
      - develop
      - feature/**
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  benchmark_single-stm32f429-qemu:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: update-tools
        run: |
          sudo apt install libncurses5-dev
          mkdir -p emu_env && cd emu_env
          wget --no-check-certificate https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi.tar.xz
          wget --no-check-certificate https://github.com/xpack-dev-tools/qemu-arm-xpack/releases/download/v8.2.6-1/xpack-qemu-arm-8.2.6-1-linux-x64.tar.gz
          tar -xzf xpack-qemu-arm-8.2.6-1-linux-x64.tar.gz
        working-directory: ./tests/beman/big_int/metal/
      - name: build benchmark_single-stm32f429
        run: |
          PATH="${{ github.workspace }}/tests/beman/big_int/metal/emu_env/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi/bin:$PATH"
          echo 'Query arm-none-eabi-g++ version'
          echo
          arm-none-eabi-g++ -v
          echo
          mkdir -p bin
          arm-none-eabi-g++ -std=c++23 -Wall -Wextra -Wpedantic -O0 -g -gdwarf-2 -ffunction-sections -fdata-sections -x c++ -fno-rtti -fno-use-cxa-atexit -fno-exceptions -fno-nonansi-builtins -fno-threadsafe-statics -fno-enforce-eh-specs -ftemplate-depth=128 -mcpu=cortex-m4 -mtune=cortex-m4 -mthumb -mfloat-abi=soft -mno-unaligned-access -mno-long-calls -I.. -I../../../../include -DAPP_BENCHMARK_STANDALONE_MAIN app_benchmark_std_big_int.cpp ./target/micros/stm32f429/make/single/crt.cpp ./target/micros/stm32f429/make/single/mcal_gcc_cxx_completion.cpp ../../../../src/divide.cpp ../../../../src/fft_mul.cpp ../../../../src/karatsuba.cpp ../../../../src/mulmod_bnm1.cpp ../../../../src/mul_dispatch.cpp ../../../../src/ntt.cpp ../../../../src/toom_cook_3.cpp ../../../../src/toom_cook_4.cpp ../../../../src/toom_cook_6_5.cpp ../../../../src/toom_cook_8_5.cpp -nostartfiles --specs=nano.specs --specs=nosys.specs -Wl,--gc-sections -Wl,-Map,./bin/app_benchmark_std_big_int.map -T ./target/micros/stm32f429/make/stm32f429.ld -Wl,--print-memory-usage -o ./bin/app_benchmark_std_big_int.elf
          arm-none-eabi-objcopy ./bin/app_benchmark_std_big_int.elf -O ihex ./bin/app_benchmark_std_big_int.hex
          ls -la ./bin/app_benchmark_std_big_int.elf ./bin/app_benchmark_std_big_int.hex ./bin/app_benchmark_std_big_int.map
        working-directory: ./tests/beman/big_int/metal/
      - name: emulate-target stm32f429
        run: |
          PATH="${{ github.workspace }}/tests/beman/big_int/metal/emu_env/xpack-qemu-arm-8.2.6-1/bin:$PATH"
          qemu-system-gnuarmeclipse --verbose --mcu STM32F429ZI --nographic --gdb tcp::9999 -d unimp,guest_errors &
          sleep 2
        working-directory: ./tests/beman/big_int/metal/
      - name: run-test-on-target
        run: |
          sleep 2
          PATH="${{ github.workspace }}/tests/beman/big_int/metal/emu_env/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi/bin:$PATH"
          echo 'Run test on target'
          echo
          arm-none-eabi-gdb ./bin/app_benchmark_std_big_int.elf -x ./target/build/test_app_benchmarks_emulator.gdb > ./app_benchmark_std_big_int.txt
          cat ./app_benchmark_std_big_int.txt
          echo
          echo 'We will now grep for the right answer...'
          grep 'value 0xF00DCAFE' ./app_benchmark_std_big_int.txt
        working-directory: ./tests/beman/big_int/metal/
