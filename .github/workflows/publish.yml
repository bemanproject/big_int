# See: https://docs.antora.org/antora/latest/publish-to-github-pages/

name: Publish to GitHub Pages with Lunr Search Extension
on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  group: github-pages
  cancel-in-progress: false
# peaceiris/actions-gh-pages only needs to push the built site to the gh-pages branch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    # package.json and antora-playbook.yml live under docs/; run steps from there
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Antora and Dependencies
        run: npm ci
      - name: Generate Site
        # `npm run build` copies the repo-root examples/ into the Antora
        # example family (see copy-examples.js) before running Antora.
        run: npm run build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/html
          publish_branch: gh-pages
          force_orphan: true
